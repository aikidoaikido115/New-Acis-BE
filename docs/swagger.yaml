  /api/emr/intake-labels:
    get:
      consumes:
      - application/json
      description: Retrieve all intake labels associated with a specific resident
        using their resident ID
      parameters:
      - description: Resident ID
        in: query
        name: resident_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Resident labels retrieved successfully
          schema:
            properties:
              message:
                type: string
              result:
                items:
                  type: object
                type: array
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      security:
      - BearerAuth: []
      summary: Get Resident Labels by Resident ID
      tags:
      - Intake
    post:
      consumes:
      - application/json
      description: Create one or more intake labels (vital signs, notes, etc.) for
        a specific resident
      parameters:
      - description: Resident ID and array of labels
        in: body
        name: request
        required: true
        schema:
          properties:
            labels:
              items:
                properties:
                  label_name:
                    type: string
                  note_text:
                    type: string
                type: object
              type: array
            resident_id:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Intake labels created successfully
          schema:
            properties:
              message:
                type: string
              result:
                items:
                  type: object
                type: array
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Missing required fields or invalid data
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "401":
          description: Unauthorized - Missing or invalid authentication
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      security:
      - BearerAuth: []
      summary: Create Intake Labels for Resident
      tags:
      - Intake
  /api/emr/intake-labels/all:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all available intake label types (e.g., Blood
