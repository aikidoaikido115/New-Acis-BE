  /api/emr/residents:
    get:
      consumes:
      - application/json
      description: Retrieve all residents assigned to a specific room using room_id
        query parameter
      parameters:
      - description: Room ID
        in: query
        name: room_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Residents retrieved successfully
          schema:
            properties:
              message:
                type: string
              result:
                items:
                  type: object
                type: array
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Missing room_id query parameter
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      security:
      - BearerAuth: []
      summary: Get Residents by Room ID
      tags:
      - Resident
    post:
      consumes:
      - application/json
      description: 'Create a new resident. Required: room_id, first_name, last_name,
        gender, id_card_number (13 digits), date_of_birth, check_in_date, status (active/inactive).
        Optional: nickname, purpose_of_stay, expected_check_out_date, pre_existing_conditions,
        pre_existing_conditions_notes, resuscitation_status (CPR/DNR), surgical_history,
        preferred_emergency_hospital, emergency_hospital_phone (10 digits)'
      parameters:
      - description: Resident information
        in: body
        name: request
        required: true
        schema:
          properties:
            check_in_date:
              type: string
            date_of_birth:
              type: string
            emergency_hospital_phone:
              type: string
            expected_check_out_date:
              type: string
            first_name:
              type: string
            gender:
              type: string
            id_card_number:
              type: string
            last_name:
              type: string
            nickname:
              type: string
            pre_existing_conditions:
              type: string
            pre_existing_conditions_notes:
              type: string
            preferred_emergency_hospital:
              type: string
            purpose_of_stay:
              type: string
            resuscitation_status:
              type: string
            room_id:
              type: string
            status:
              type: string
            surgical_history:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Resident created successfully
          schema:
            properties:
              message:
                type: string
              result:
                type: object
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Missing or invalid fields
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      security:
      - BearerAuth: []
      summary: Create Resident
      tags:
      - Resident
  /api/emr/residents/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a single resident's information by their unique ID
      parameters:
      - description: Resident ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Resident retrieved successfully
          schema:
