basePath: /
definitions:
  entities.VitalSign:
    properties:
      blood_pressure_diastolic:
        type: integer
      blood_pressure_systolic:
        type: integer
      breathing_rate:
        type: integer
      created_at:
        type: string
      created_by_staff_id:
        type: string
      heart_rate:
        type: integer
      oxygen_saturation:
        type: integer
      resident_id:
        type: string
      temperature:
        type: number
      updated_at:
        type: string
      vital_sign_id:
        type: string
    type: object
  models.CreateVitalSignRequest:
    properties:
      blood_pressure_diastolic:
        type: integer
      blood_pressure_systolic:
        type: integer
      breathing_rate:
        type: integer
      heart_rate:
        type: integer
      oxygen_saturation:
        type: integer
      resident_id:
        type: string
      temperature:
        type: number
    required:
    - resident_id
    type: object
info:
  contact: {}
  description: This is a sample for New-Acis API.
  title: New-Acis API
paths:
  /api/auth/forgotpassword:
    post:
      consumes:
      - application/json
      description: Send OTP to user's email for password recovery
      parameters:
      - description: User email
        in: body
        name: request
        required: true
        schema:
          properties:
            email:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Sent OTP successfully
          schema:
            properties:
              message:
                type: string
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Email is missing
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      summary: Forgot Password - Request OTP
      tags:
      - Authentication
  /api/auth/forgotpassword/changepassword:
    patch:
      consumes:
      - application/json
      description: Change password after OTP verification in forgot password flow
      parameters:
      - description: Email and new password
        in: body
        name: request
        required: true
        schema:
          properties:
            email:
              type: string
            new_password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          schema:
            properties:
              message:
                type: string
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Email or new password is missing
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      summary: Change Password (Forgot Password Flow)
      tags:
      - Authentication
  /api/auth/forgotpassword/otp:
    post:
      consumes:
      - application/json
      description: Verify the OTP sent to user's email for password recovery
      parameters:
      - description: Email and OTP
        in: body
        name: request
        required: true
        schema:
          properties:
            email:
              type: string
            otp:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OTP is correct
          schema:
            properties:
              message:
                type: string
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Email or OTP is missing
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      summary: Verify OTP
      tags:
      - Authentication
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Login with username or email and password to get access token.
        You must provide EITHER username OR email, not both
      parameters:
      - description: Login credentials (provide EITHER username OR email with password,
          not both)
        in: body
        name: request
        required: true
        schema:
          properties:
            email:
              type: string
            password:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            properties:
              message:
                type: string
              result:
                properties:
                  email:
                    type: string
                  profile_image:
                    type: string
                  token:
                    type: string
                  user_id:
                    type: string
                  username:
                    type: string
                type: object
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Missing credentials, sent both username and email,
            or missing password
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      summary: User Login
      tags:
      - Authentication
  /api/auth/logout:
    post:
      consumes:
      - application/json
      description: Logout authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      security:
      - BearerAuth: []
      summary: User Logout
      tags:
      - Authentication
  /api/auth/register:
    post:
      consumes:
      - multipart/form-data
      description: Register a new user with username, email, password, and role
      parameters:
      - description: Username
        in: formData
        name: username
        required: true
        type: string
      - description: Email
        in: formData
        name: email
        required: true
        type: string
      - description: Password
        in: formData
        name: password
        required: true
        type: string
      - description: First Name
        in: formData
        name: first_name
        type: string
      - description: Last Name
        in: formData
        name: last_name
        type: string
      - description: Nickname
        in: formData
        name: nickname
        type: string
      - description: Role Name
        in: formData
        name: role_name
        required: true
        type: string
      - description: Profile Image
        in: formData
        name: profile_image
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            properties:
              message:
                type: string
              result:
                type: object
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Missing required fields
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      summary: User Registration
      tags:
      - Authentication
  /api/auth/resetpassword:
    patch:
      consumes:
      - application/json
      description: Reset password for authenticated user with old password verification
      parameters:
      - description: Password reset information
        in: body
        name: request
        required: true
        schema:
          properties:
            new_password:
              type: string
            old_password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Old password invalid or passwords are the same
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "401":
          description: Unauthorized - Missing user ID
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "404":
          description: User not found
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      security:
      - BearerAuth: []
      summary: Reset Password (Authenticated)
      tags:
      - Authentication
  /api/emr/dashboard/resident-gender-stats:
