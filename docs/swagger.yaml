basePath: /
host: localhost:8000
info:
  contact: {}
  description: This is a sample for New-Acis API.
  title: New-Acis API
paths:
  /api/auth/forgotpassword:
    post:
      consumes:
      - application/json
      description: Send OTP to user's email for password recovery
      parameters:
      - description: User email
        in: body
        name: request
        required: true
        schema:
          properties:
            email:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Sent OTP successfully
          schema:
            properties:
              message:
                type: string
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Email is missing
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      summary: Forgot Password - Request OTP
      tags:
      - Authentication
  /api/auth/forgotpassword/changepassword:
    put:
      consumes:
      - application/json
      description: Change password after OTP verification in forgot password flow
      parameters:
      - description: Email and new password
        in: body
        name: request
        required: true
        schema:
          properties:
            email:
              type: string
            new_password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          schema:
            properties:
              message:
                type: string
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Email or new password is missing
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      summary: Change Password (Forgot Password Flow)
      tags:
      - Authentication
  /api/auth/forgotpassword/otp:
    post:
      consumes:
      - application/json
      description: Verify the OTP sent to user's email for password recovery
      parameters:
      - description: Email and OTP
        in: body
        name: request
        required: true
        schema:
          properties:
            email:
              type: string
            otp:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OTP is correct
          schema:
            properties:
              message:
                type: string
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Email or OTP is missing
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      summary: Verify OTP
      tags:
      - Authentication
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Login with username and password to get access token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          properties:
            password:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            properties:
              message:
                type: string
              result:
                properties:
                  email:
                    type: string
                  profile_image:
                    type: string
                  token:
                    type: string
                  user_id:
                    type: string
                  username:
                    type: string
                type: object
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Missing username or password
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      summary: User Login
      tags:
      - Authentication
  /api/auth/logout:
    post:
      consumes:
      - application/json
      description: Logout authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      security:
      - BearerAuth: []
      summary: User Logout
      tags:
      - Authentication
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with username, email, password, and role
      parameters:
      - description: Registration information
        in: body
        name: request
        required: true
        schema:
          properties:
            email:
              type: string
            password:
              type: string
            role_name:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            properties:
              message:
                type: string
              result:
                type: object
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Missing required fields
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      summary: User Registration
      tags:
      - Authentication
  /api/auth/resetpassword:
    put:
      consumes:
      - application/json
      description: Reset password for authenticated user with old password verification
      parameters:
      - description: Password reset information
        in: body
        name: request
        required: true
        schema:
          properties:
            email:
              type: string
            new_password:
              type: string
            old_password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Old password invalid
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "401":
          description: Unauthorized - Missing user ID
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "404":
          description: User not found
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      security:
      - BearerAuth: []
      summary: Reset Password (Authenticated)
      tags:
      - Authentication
  /api/user:
    get:
      consumes:
      - application/json
      description: Get authenticated user's information
      produces:
      - application/json
      responses:
        "200":
          description: User Info retrieved successfully
          schema:
            properties:
              message:
                type: string
              result:
                type: object
              status:
                type: string
              status_code:
                type: integer
            type: object
        "401":
          description: Unauthorized - Missing user ID
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "404":
          description: User not found
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      security:
      - BearerAuth: []
      summary: Get User Information
      tags:
      - User
    put:
      consumes:
      - multipart/form-data
      description: Update authenticated user's profile including username, first name,
        last name, nickname, gender, and profile image
      parameters:
      - description: Username
        in: formData
        name: username
        type: string
      - description: First Name
        in: formData
        name: first_name
        type: string
      - description: Last Name
        in: formData
        name: last_name
        type: string
      - description: Nickname
        in: formData
        name: nickname
        type: string
      - description: Gender
        in: formData
        name: gender
        type: string
      - description: Profile Image
        in: formData
        name: profile_image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: User updated successfully
          schema:
            properties:
              message:
                type: string
              result:
                type: object
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Invalid form data
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "401":
          description: Unauthorized - Missing user ID
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      security:
      - BearerAuth: []
      summary: Update User Information
      tags:
      - User
  /api/user/staff/files:
    post:
      consumes:
      - multipart/form-data
      description: Upload multiple files for staff member
      parameters:
      - description: Files to upload (can select multiple)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Staff files created successfully
          schema:
            properties:
              message:
                type: string
              result:
                type: array
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - No files provided or invalid form data
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "401":
          description: Unauthorized - Missing user ID
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      security:
      - BearerAuth: []
      summary: Upload Staff Files
      tags:
      - User
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
