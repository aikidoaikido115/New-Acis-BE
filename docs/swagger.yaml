                type: string
              status_code:
                type: integer
            type: object
      security:
      - BearerAuth: []
      summary: Get Resident by ID
      tags:
      - Resident
    patch:
      consumes:
      - application/json
      description: Partially update an existing resident's information by their unique
        ID. All fields are optional — only send fields that need to be updated.
      parameters:
      - description: Resident ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update (all optional)
        in: body
        name: request
        schema:
          properties:
            check_in_date:
              type: string
            date_of_birth:
              type: string
            emergency_hospital_phone:
              type: string
            expected_check_out_date:
              type: string
            first_name:
              type: string
            gender:
              type: string
            id_card_number:
              type: string
            labels:
              items:
                properties:
                  label_name:
                    type: string
                  note_text:
                    type: string
                type: object
              type: array
            last_name:
              type: string
            nickname:
              type: string
            pre_existing_conditions:
              type: string
            pre_existing_conditions_notes:
              type: string
            preferred_emergency_hospital:
              type: string
            purpose_of_stay:
              type: string
            resuscitation_status:
              type: string
            room_id:
              type: string
            status:
              type: string
            surgical_history:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Resident updated successfully
          schema:
            properties:
              message:
                type: string
              result:
                type: object
              status:
                type: string
              status_code:
                type: integer
            type: object
        "400":
          description: Bad Request - Invalid data
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              message:
                type: string
              result: {}
              status:
                type: string
              status_code:
                type: integer
            type: object
      security:
      - BearerAuth: []
      summary: Update Resident
      tags:
      - Resident
